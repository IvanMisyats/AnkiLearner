# AnkiLearner vhost. Install to /etc/nginx/conf.d/anki.misyats.com.conf.
#
# Depends on host-level pieces installed from the private infra repo (vps/nginx/):
#   /etc/nginx/conf.d/00-shared.conf                  real_ip, log_format cf, server_tokens off
#   /etc/nginx/conf.d/00-default-server.conf          catch-all 444
#   /etc/nginx/conf.d/includes/cf-origin-tls.conf     Origin CA + Authenticated Origin Pulls
#   /etc/nginx/conf.d/includes/security-headers.conf  HSTS, nosniff, frame-ancestors, ...
#
# This is a PURE PROXY: the Angular SPA is baked into the API image's wwwroot and served by
# ASP.NET, so nginx needs no read access to this application's files. That keeps single-origin
# intact (no CORS, and the httpOnly+Secure refresh cookie keeps working) and means CI never
# writes anything onto the host.
#
# TLS is a Cloudflare Origin CA certificate — no certbot on this host. Authenticated Origin Pulls
# means a direct `curl --resolve` to the origin fails the handshake by design; test through a
# proxied Cloudflare hostname.

# Per-IP rate limits, namespaced anki_* — QuestionsHub shares this http context.
# The API applies its own per-user limits too (RateLimiting:AuthPerMinute / LookupPerMinute);
# this is the cheaper outer layer that never reaches ASP.NET.
limit_req_zone $remote_addr zone=anki_auth_zone:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name anki.misyats.com;

    ssl_certificate     /etc/ssl/cloudflare/misyats.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/misyats.com.key;
    include /etc/nginx/conf.d/includes/cf-origin-tls.conf;
    include /etc/nginx/conf.d/includes/security-headers.conf;

    access_log /var/log/nginx/anki.misyats.com.access.log cf;
    error_log  /var/log/nginx/anki.misyats.com.error.log;

    # Kept above the app's own Import:MaxUploadBytes so an oversized .apkg gets the API's JSON
    # error rather than a bare nginx 413. Raise both together if large decks need importing.
    client_max_body_size 64m;
    client_body_timeout  120s;

    # Health endpoint is for the deploy script on 127.0.0.1 — not for the internet.
    location = /api/health {
        access_log off;
        return 404;
    }

    # Credential endpoints — strict rate limiting before anything reaches ASP.NET.
    location /api/auth/ {
        limit_req zone=anki_auth_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: API routes and the SPA, both served by the container.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
